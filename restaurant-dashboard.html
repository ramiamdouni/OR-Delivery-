<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Dashboard - OR Delivery</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <h1>🍽️ Restaurant Dashboard</h1>

    <p>إدارة الطلبات الجديدة</p>

</header>



<section class="menu">

    <h2>📦 الطلبات</h2>

    <div id="orders">

        <p>⏳ جاري تحميل الطلبات...</p>

    </div>

</section>



<script type="module">


// =====================================
// Firebase
// =====================================


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

    getFirestore,

    collection,

    getDocs,

    doc,

    updateDoc

}

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



// =====================================
// Firebase Configuration
// =====================================


const firebaseConfig = {

    apiKey: "AIzaSyCxLawlbfVBlt7DjYzMnfW3WIMvbgtsmQI",

    authDomain: "or-delivery-e0a82.firebaseapp.com",

    projectId: "or-delivery-e0a82",

    storageBucket: "or-delivery-e0a82.firebasestorage.app",

    messagingSenderId: "491769193881",

    appId: "1:491769193881:web:67159246794a957f0edf08",

    measurementId: "G-TWHMY1TCGV"

};



// =====================================
// Initialize Firebase
// =====================================


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


console.log("🔥 Restaurant Dashboard Connected!");



// =====================================
// Orders Container
// =====================================


const ordersContainer =

document.getElementById("orders");



// =====================================
// Load Orders
// =====================================


async function loadOrders() {


    ordersContainer.innerHTML = `

        <p>

            ⏳ جاري الاتصال بقاعدة البيانات...

        </p>

    `;


    try {


        // Get ALL orders

        const snapshot =

        await getDocs(

            collection(db, "orders")

        );


        console.log(

            "📦 عدد الطلبات:",

            snapshot.size

        );



        ordersContainer.innerHTML = "";



        // =====================================
        // No Orders
        // =====================================


        if (snapshot.empty) {


            ordersContainer.innerHTML = `

                <div class="card">

                    <h2>📭 ما فماش طلبات توّا</h2>

                    <p>

                        كي يجي طلب جديد باش يظهر هنا.

                    </p>

                </div>

            `;


            return;

        }



        // =====================================
        // Display Orders
        // =====================================


        snapshot.forEach((orderDoc) => {


            const order = orderDoc.data();


            console.log(

                "📦 Order:",

                order

            );



            const card =

            document.createElement("div");


            card.className = "card";



            // =====================================
            // Items
            // =====================================


            let itemsHTML = "";


            if (

                order.items &&

                Array.isArray(order.items)

            ) {


                itemsHTML =

                order.items.map(

                    item => `

                        <li>

                            🍔

                            ${item.name || "منتج"}

                            -

                            ${item.price || 0}

                            د.ت

                        </li>

                    `

                ).join("");


            } else {


                itemsHTML =

                "<li>لا توجد تفاصيل</li>";

            }



            // =====================================
            // Order Card
            // =====================================


            card.innerHTML = `

                <h2>

                    📦 طلب جديد

                </h2>


                <p>

                    🆔 رقم الطلب:

                    <br>

                    <strong>

                        ${orderDoc.id}

                    </strong>

                </p>


                <hr>


                <p>

                    👤 الحريف:

                    <strong>

                        ${order.clientName || "غير معروف"}

                    </strong>

                </p>


                <p>

                    📞 الهاتف:

                    ${order.phone || "غير متوفر"}

                </p>


                <p>

                    📍 العنوان:

                    ${order.address || "غير متوفر"}

                </p>


                <h3>

                    🍔 الطلب:

                </h3>


                <ul>

                    ${itemsHTML}

                </ul>


                <h3>

                    💰 المجموع:

                    ${order.total || 0}

                    د.ت

                </h3>


                <p>

                    📌 الحالة:

                    <strong>

                        ${order.status || "pending"}

                    </strong>

                </p>


                <br>


                <button

                    class="accept-button"

                    data-id="${orderDoc.id}"

                >

                    ✅ قبول الطلب

                </button>


                <button

                    class="reject-button"

                    data-id="${orderDoc.id}"

                >

                    ❌ رفض الطلب

                </button>

            `;



            // =====================================
            // Accept Button
            // =====================================


            const acceptButton =

            card.querySelector(

                ".accept-button"

            );


            acceptButton.addEventListener(

                "click",

                () =>

                updateOrderStatus(

                    orderDoc.id,

                    "accepted"

                )

            );



            // =====================================
            // Reject Button
            // =====================================


            const rejectButton =

            card.querySelector(

                ".reject-button"

            );


            rejectButton.addEventListener(

                "click",

                () =>

                updateOrderStatus(

                    orderDoc.id,

                    "rejected"

                )

            );



            // Add Card

            ordersContainer.appendChild(card);


        });


    }


    catch (error) {


        console.error(

            "❌ Firebase Error:",

            error

        );


        ordersContainer.innerHTML = `

            <div class="card">

                <h2>

                    ❌ صار خطأ في تحميل الطلبات

                </h2>


                <p>

                    ${error.message}

                </p>


                <p>

                    افتح Console باش تشوف تفاصيل الخطأ.

                </p>

            </div>

        `;

    }

}



// =====================================
// Update Order Status
// =====================================


async function updateOrderStatus(

    orderId,

    newStatus

) {


    try {


        await updateDoc(

            doc(

                db,

                "orders",

                orderId

            ),

            {

                status: newStatus

            }

        );


        alert(

            newStatus === "accepted"

            ? "✅ تم قبول الطلب"

            : "❌ تم رفض الطلب"

        );


        // Reload orders

        loadOrders();


    }


    catch (error) {


        console.error(

            "❌ Update Error:",

            error

        );


        alert(

            "❌ صار خطأ: " +

            error.message

        );

    }

}



// =====================================
// Start Dashboard
// =====================================


loadOrders();


</script>


</body>

</html>
