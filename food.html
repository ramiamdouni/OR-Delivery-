<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food - OR Delivery</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🍔 Food</h1>
    <p>اختار المطعم اللي تحب تطلب منو</p>
</header>

<section class="menu">

    <h2>🍽️ المطاعم</h2>

    <div id="restaurants">
        <p>جاري تحميل المطاعم...</p>
    </div>

</section>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCA0-yi6utUJaq4DeW_nIAqbMMCvHA5YV8",

    authDomain: "or-delivery.firebaseapp.com",

    projectId: "or-delivery",

    storageBucket: "or-delivery.firebasestorage.app",

    messagingSenderId: "861150247174",

    appId: "1:861150247174:web:a53b38d8e85a5b55b78687",

    measurementId: "G-QF1CYPZ2XJ"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const restaurantsContainer =
document.getElementById("restaurants");


async function loadRestaurants() {

    restaurantsContainer.innerHTML =
    "<p>⏳ جاري الاتصال بقاعدة البيانات...</p>";

    try {

        const snapshot =
        await getDocs(collection(db, "restaurants"));

        console.log("Restaurants:", snapshot.size);

        restaurantsContainer.innerHTML = "";


        if (snapshot.empty) {

            restaurantsContainer.innerHTML =
            "<p>⚠️ ما فماش مطاعم في قاعدة البيانات.</p>";

            return;

        }


        let count = 0;


        snapshot.forEach((doc) => {

            const restaurant = doc.data();

            console.log("Restaurant:", restaurant);


            // نعرضو كان المطاعم اللي active متاعها true
            if (
                restaurant.active !== undefined &&
                restaurant.active !== true
            ) {
                return;
            }


            count++;


            const card =
            document.createElement("div");

            card.className = "card";


            card.innerHTML = `

                <h2>🍽️ ${restaurant.name || "مطعم بدون اسم"}</h2>

                <p>
                    📍 ${restaurant.address || "العنوان غير متوفر"}
                </p>

                <p>
                    🍴 ${restaurant.category || "مطعم"}
                </p>

                <p>
                    📞 ${restaurant.phone || "غير متوفر"}
                </p>

                <button class="restaurant-button">
                    شوف القائمة
                </button>

            `;


            const button =
            card.querySelector(".restaurant-button");


            button.addEventListener("click", function() {

                window.location.href =
                "menu.html?restaurantId=" + doc.id;

            });


            restaurantsContainer.appendChild(card);

        });


        if (count === 0) {

            restaurantsContainer.innerHTML =
            "<p>⚠️ ما فماش مطاعم مفعّلة توّا.</p>";

        }


    } catch (error) {

        console.error("Firebase Error:", error);

        restaurantsContainer.innerHTML = `

            <p>❌ صار خطأ في تحميل المطاعم.</p>

            <p>
                ${error.message}
            </p>
