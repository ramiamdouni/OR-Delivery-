<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مطعمك - OR Delivery</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🍽️ مطعمك</h1>

<p>
    اطلب أكلك ويوصلك مع OR Delivery 🛵
</p>

</header><section class="menu"><div class="card"><img src="pizza.jpg" alt="Pizza">

<h2>Pizza 4 Fromages</h2>

<p>بيتزا بالجبن</p>

<span>18 د.ت</span>

<button onclick="addToCart('Pizza 4 Fromages',18)">
    أضف للسلة
</button>

</div><div class="card"><img src="burger.jpg" alt="Burger">

<h2>Burger Maison</h2>

<p>برغر منزلي</p>

<span>12 د.ت</span>

<button onclick="addToCart('Burger Maison',12)">
    أضف للسلة
</button>

</div><div class="card"><img src="frites.jpg" alt="Frites">

<h2>Frites</h2>

<p>بطاطا مقلية</p>

<span>5 د.ت</span>

<button onclick="addToCart('Frites',5)">
    أضف للسلة
</button>

</div></section><div class="cart"><h2>🛒 طلبك</h2><ul id="cart"></ul><h3>المجموع:

<span id="total">0</span>

د.ت

</h3><hr><h2>📦 معلومات التوصيل</h2><input
type="text"
id="clientName"
placeholder="اسمك الكامل"

«»

<input
type="tel"
id="phone"
placeholder="رقم الهاتف"

«»

<input
type="text"
id="address"
placeholder="عنوان التوصيل"

«»

<button
class="order"
onclick="sendOrder()"

«»

تأكيد الطلب

</button><div
id="confirmation"
style="display:none;"
><h2>
📦 حالة طلبك
</h2><p>
رقم طلبك:
<strong id="orderNumber"></strong>
</p><p id="status">
⏳ طلبك قيد الانتظار...
</p></div></div><script type="module">


// ======================================
// Firebase
// ======================================


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

    getFirestore,

    collection,

    addDoc,

    serverTimestamp,

    doc,

    onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


// ======================================
// Firebase Configuration
// ======================================


const firebaseConfig = {

    apiKey: "AIzaSyCxLawlbfVBlt7DjYzMnfW3WIMvbgtsmQI",

    authDomain: "or-delivery-e0a82.firebaseapp.com",

    projectId: "or-delivery-e0a82",

    storageBucket: "or-delivery-e0a82.firebasestorage.app",

    messagingSenderId: "491769193881",

    appId: "1:491769193881:web:67159246794a957f0edf08",

    measurementId: "G-TWHMY1TCGV"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


console.log("🔥 OR Delivery Firebase Connected!");


// ======================================
// Restaurant ID
// ======================================


const urlParams =

new URLSearchParams(

    window.location.search

);


const restaurantId =

urlParams.get("restaurantId");


console.log(

    "🍽️ Restaurant ID:",

    restaurantId

);


// ======================================
// Cart
// ======================================


let total = 0;

let items = [];


// ======================================
// Add Product
// ======================================


window.addToCart = function(

    name,

    price

) {


    items.push({

        name: name,

        price: price

    });


    total += price;


    document.getElementById(

        "cart"

    ).innerHTML =

    items.map(item =>

        "<li>" +

        item.name +

        " - " +

        item.price +

        " د.ت</li>"

    ).join("");


    document.getElementById(

        "total"

    ).innerText = total;


};


// ======================================
// Watch Order Status
// ======================================


function watchOrderStatus(orderId) {


    const orderRef = doc(

        db,

        "orders",

        orderId

    );


    onSnapshot(

        orderRef,

        (snapshot) => {


            if (!snapshot.exists()) {

                return;

            }


            const order =

            snapshot.data();


            const statusElement =

            document.getElementById(

                "status"

            );


            if (

                order.status ===

                "pending"

            ) {


                statusElement.innerText =

                "⏳ طلبك قيد الانتظار...";


            }


            else if (

                order.status ===

                "accepted"

            ) {


                statusElement.innerText =

                "✅ تم قبول طلبك من المطعم!";


            }


            else if (

                order.status ===

                "rejected"

            ) {


                statusElement.innerText =

                "❌ للأسف، المطعم رفض طلبك.";

            }


        },


        (error) => {


            console.error(

                "❌ Status Error:",

                error

            );


        }

    );

}


// ======================================
// Send Order
// ======================================


window.sendOrder = async function() {


    const clientName =

    document

    .getElementById(

        "clientName"

    )

    .value

    .trim();


    const phone =

    document

    .getElementById(

        "phone"

    )

    .value

    .trim();


    const address =

    document

    .getElementById(

        "address"

    )

    .value

    .trim();


    if (!restaurantId) {


        alert(

            "❌ لم يتم تحديد المطعم."

        );


        return;

    }


    if (

        items.length === 0

    ) {


        alert(

            "⚠️ أضف منتج للسلة أولاً"

        );


        return;

    }


    if (

        !clientName ||

        !phone ||

        !address

    ) {


        alert(

            "⚠️ الرجاء إدخال الاسم ورقم الهاتف والعنوان"

        );


        return;

    }


    const button =

    document.querySelector(

        ".order"

    );


    button.disabled = true;


    button.innerText =

    "جاري إرسال الطلب...";


    try {


        const orderRef =

        await addDoc(

            collection(

                db,

                "orders"

            ),

            {


                restaurantId:

                restaurantId,


                clientName:

                clientName,


                phone:

                phone,


                address:

                address,


                items:

                items,


                total:

                total,


                status:

                "pending",


                createdAt:

                serverTimestamp()


            }

        );


        document

        .getElementById(

            "confirmation"

        )

        .style.display =

        "block";


        document

        .getElementById(

            "orderNumber"

        ).innerText =

        orderRef.id;


        button.style.display =

        "none";


        watchOrderStatus(

            orderRef.id

        );


        console.log(

            "✅ Order Created:",

            orderRef.id

        );


    }


    catch (error) {


        console.error(

            "❌ Firebase Error:",

            error

        );


        alert(

            "❌ خطأ: " +

            error.message

        );


        button.disabled =

        false;


        button.innerText =

        "تأكيد الطلب";

    }

};


</script></body></html>
