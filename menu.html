<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OR Delivery - Restaurant Menu</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🍽️ OR Delivery</h1>

<p>اختار أكلك واطلب توّا 🛵</p>

</header><section class="menu"><h2>🍔 قائمة الطعام</h2>


<div class="card">

    <h2>🍕 Pizza 4 Fromages</h2>

    <p>بيتزا بالجبن</p>

    <strong>18 د.ت</strong>

    <br><br>

    <button
        onclick="addToCart('Pizza 4 Fromages', 18)"
    >
        أضف للسلة
    </button>

</div>



<div class="card">

    <h2>🍔 Burger Maison</h2>

    <p>برغر منزلي</p>

    <strong>12 د.ت</strong>

    <br><br>

    <button
        onclick="addToCart('Burger Maison', 12)"
    >
        أضف للسلة
    </button>

</div>



<div class="card">

    <h2>🍟 Frites</h2>

    <p>بطاطا مقلية</p>

    <strong>5 د.ت</strong>

    <br><br>

    <button
        onclick="addToCart('Frites', 5)"
    >
        أضف للسلة
    </button>

</div>

</section><section class="cart"><h2>🛒 طلبك</h2>


<ul id="cart">

    <li>السلة فارغة</li>

</ul>


<h3>

    💰 المجموع:

    <span id="total">0</span>

    د.ت

</h3>



<hr>



<h2>📦 معلومات التوصيل</h2>


<input
    type="text"
    id="clientName"
    placeholder="👤 اسمك الكامل"
>


<input
    type="tel"
    id="phone"
    placeholder="📞 رقم الهاتف"
>


<input
    type="text"
    id="address"
    placeholder="📍 عنوان التوصيل"
>



<button
    id="orderButton"
    class="order"
    onclick="sendOrder()"
>

    ✅ تأكيد الطلب

</button>



<div
    id="confirmation"
    style="display:none;"
>

    <hr>

    <h2>📦 متابعة طلبك</h2>


    <p>

        🆔 رقم الطلب:

        <strong id="orderNumber"></strong>

    </p>


    <p>

        📌 حالة الطلب:

    </p>


    <h3 id="status">

        ⏳ طلبك قيد الانتظار...

    </h3>


</div>

</section><script type="module">


// ==========================================
// Firebase
// ==========================================


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

    getFirestore,

    collection,

    addDoc,

    serverTimestamp,

    doc,

    onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



// ==========================================
// Firebase Configuration
// ==========================================


const firebaseConfig = {

    apiKey: "AIzaSyCxLawlbfVBlt7DjYzMnfW3WIMvbgtsmQI",

    authDomain: "or-delivery-e0a82.firebaseapp.com",

    projectId: "or-delivery-e0a82",

    storageBucket: "or-delivery-e0a82.firebasestorage.app",

    messagingSenderId: "491769193881",

    appId: "1:491769193881:web:67159246794a957f0edf08",

    measurementId: "G-TWHMY1TCGV"

};



// ==========================================
// Start Firebase
// ==========================================


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


console.log("🔥 Firebase Connected!");



// ==========================================
// Get Restaurant ID
// ==========================================


const urlParams =

new URLSearchParams(

    window.location.search

);


const restaurantId =

urlParams.get(

    "restaurantId"

);


console.log(

    "🍽️ Restaurant ID:",

    restaurantId

);



// ==========================================
// Cart
// ==========================================


let items = [];

let total = 0;



// ==========================================
// Add To Cart
// ==========================================


window.addToCart = function(

    name,

    price

) {


    items.push({

        name: name,

        price: price

    });


    total += price;


    updateCart();

};



// ==========================================
// Update Cart
// ==========================================


function updateCart() {


    const cart =

    document.getElementById(

        "cart"

    );


    const totalElement =

    document.getElementById(

        "total"

    );


    if (

        items.length === 0

    ) {


        cart.innerHTML =

        "<li>السلة فارغة</li>";


    }

    else {


        cart.innerHTML =

        items.map(

            (item, index) => `

                <li>

                    ${item.name}

                    -

                    ${item.price}

                    د.ت

                </li>

            `

        ).join("");

    }


    totalElement.innerText =

    total;

}



// ==========================================
// Watch Order Status
// ==========================================


function watchOrderStatus(

    orderId

) {


    const orderRef = doc(

        db,

        "orders",

        orderId

    );


    onSnapshot(

        orderRef,

        (snapshot) => {


            if (

                !snapshot.exists()

            ) {

                return;

            }


            const order =

            snapshot.data();


            const statusElement =

            document.getElementById(

                "status"

            );


            if (

                order.status ===

                "pending"

            ) {


                statusElement.innerText =

                "⏳ طلبك قيد الانتظار عند المطعم";


            }


            else if (

                order.status ===

                "accepted"

            ) {


                statusElement.innerText =

                "✅ المطعم قبل طلبك! جاري تحضير الطلب";


            }


            else if (

                order.status ===

                "rejected"

            ) {


                statusElement.innerText =

                "❌ للأسف، المطعم رفض طلبك";

            }


        },


        (error) => {


            console.error(

                "❌ Status Error:",

                error

            );

        }

    );

}



// ==========================================
// Send Order
// ==========================================


window.sendOrder = async function() {


    const clientName =

    document

    .getElementById(

        "clientName"

    )

    .value

    .trim();


    const phone =

    document

    .getElementById(

        "phone"

    )

    .value

    .trim();


    const address =

    document

    .getElementById(

        "address"

    )

    .value

    .trim();



    // ======================================

    // Check Restaurant

    // ======================================


    if (

        !restaurantId

    ) {


        alert(

            "❌ المطعم غير محدد"

        );


        return;

    }



    // ======================================

    // Check Cart

    // ======================================


    if (

        items.length === 0

    ) {


        alert(

            "⚠️ السلة فارغة، أضف طلبك أولاً"

        );


        return;

    }



    // ======================================

    // Check Client Information

    // ======================================


    if (

        !clientName ||

        !phone ||

        !address

    ) {


        alert(

            "⚠️ الرجاء إدخال الاسم ورقم الهاتف والعنوان"

        );


        return;

    }



    const button =

    document.getElementById(

        "orderButton"

    );


    button.disabled =

    true;


    button.innerText =

    "⏳ جاري إرسال الطلب...";



    try {


        // ==================================

        // Create Order

        // ==================================


        const orderRef =

        await addDoc(

            collection(

                db,

                "orders"

            ),

            {


                restaurantId:

                restaurantId,


                clientName:

                clientName,


                phone:

                phone,


                address:

                address,


                items:

                items,


                total:

                total,


                status:

                "pending",


                createdAt:

                serverTimestamp()

            }

        );



        console.log(

            "✅ Order Created:",

            orderRef.id

        );



        // ==================================

        // Show Confirmation

        // ==================================


        document

        .getElementById(

            "confirmation"

        )

        .style.display =

        "block";


        document

        .getElementById(

            "orderNumber"

        )

        .innerText =

        orderRef.id;



        // Hide Button

        button.style.display =

        "none";



        // ==================================

        // Watch Status

        // ==================================


        watchOrderStatus(

            orderRef.id

        );


    }


    catch (error) {


        console.error(

            "❌ Firebase Error:",

            error

        );


        alert(

            "❌ صار خطأ: " +

            error.message

        );


        button.disabled =

        false;


        button.innerText =

        "✅ تأكيد الطلب";

    }

};


</script></body></html>
